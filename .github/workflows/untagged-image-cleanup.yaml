name: Cleanup Untagged Images

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
 untagged-images-cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: false 
          delete-untagged: true
